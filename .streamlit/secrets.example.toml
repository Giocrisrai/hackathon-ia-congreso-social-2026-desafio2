# Copia este contenido en Streamlit Cloud → App → Settings → Secrets (NO lo subas a GitHub con valores reales).

# Un bloque por equipo: código (lo que escribe el equipo) → nombre y clave.
[equipos.E01]
nombre = "Equipo 01"
clave = "cambiar"

[equipos.E02]
nombre = "Equipo 02"
clave = "cambiar"

[ia]
orden = ["groq", "mistral", "openai"]   # se prueba en este orden; si uno falla, pasa al siguiente
limite_consultas_por_equipo = 120

[ia.groq]
api_key = "gsk_..."   # console.groq.com/keys (plan gratuito)
modelo = "openai/gpt-oss-120b"
modelo_respaldo = "openai/gpt-oss-20b"   # se usa si el principal se satura (límite por minuto)

[ia.mistral]
api_key = ""          # opcional, respaldo gratuito
modelo = "mistral-small-latest"

[ia.openai]
api_key = ""          # opcional
modelo = "gpt-4o-mini"

# Opcional: copia del registro en una planilla central persistente (recomendado,
# porque Streamlit Cloud borra los archivos locales al reiniciar o dormir la app).
[registro]
sheet_id = ""   # ID de una planilla de Google compartida con la cuenta de servicio (permiso de edición)
