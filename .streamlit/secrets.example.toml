# Copia este contenido en Streamlit Cloud → App → Settings → Secrets (NO lo subas a GitHub con valores reales).

# Un bloque por equipo: código (lo que escribe el equipo) → nombre y clave.
[equipos.E01]
nombre = "Equipo 01"
clave = "cambiar"

[equipos.E02]
nombre = "Equipo 02"
clave = "cambiar"

[ia]
# La app prueba en este orden: cada proveedor y, dentro de él, cada modelo de la lista.
# Si uno falla o se satura, pasa al siguiente sin que el equipo lo note; si todos fallan, muestra una respuesta de demostración.
orden = ["groq", "mistral"]
limite_consultas_por_equipo = 120

[ia.groq]
api_key = "gsk_..."   # console.groq.com/keys
modelos = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]

[ia.mistral]
api_key = ""   # console.mistral.ai/api-keys
modelos = ["mistral-small-latest", "ministral-8b-latest"]

# ¿Consiguieron otra clave? Agréguenla al final de "orden" y creen su bloque. Ejemplos listos:
# [ia.gemini]      api_key = "..."  modelos = ["gemini-2.5-flash"]
# [ia.openrouter]  api_key = "..."  modelos = ["openai/gpt-oss-120b"]
# [ia.cerebras]    api_key = "..."  modelos = ["gpt-oss-120b"]
# [ia.openai]      api_key = "..."  modelos = ["gpt-4o-mini"]
# Otro proveedor compatible con OpenAI: además pongan url = "https://.../v1/chat/completions"

# Opcional: copia del registro en una planilla central persistente (recomendado,
# porque Streamlit Cloud borra los archivos locales al reiniciar o dormir la app).
[registro]
sheet_id = ""   # ID de una planilla de Google compartida con la cuenta de servicio (permiso de edición)
